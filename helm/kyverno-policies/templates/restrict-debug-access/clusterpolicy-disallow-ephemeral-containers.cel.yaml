{{ $name := "disallow-ephemeral-containers" }}
{{ if and (hasKey .Values.debugAccessPolicies.policies $name) (get .Values.debugAccessPolicies.policies $name).enabled (eq (include "useValidatingPolicy" .) "true") }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ printf "%s%s" .Values.policyNamePrefix $name }}
  labels: {{ include "labels.common" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Block Ephemeral Containers
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Ephemeral containers, enabled by default in Kubernetes 1.23, allow users to use the `kubectl debug` functionality and attach a temporary container to an existing Pod. This may potentially be used to gain access to unauthorized information executing inside one or more containers in that Pod. This policy blocks the use of ephemeral containers.
spec:
  validationActions: {{ include "validationActions" (get .Values.debugAccessPolicies.policies $name).mode | nindent 4 }}
  evaluation:
    background:
      enabled: true
  # A ClusterPolicy matching Pod also matches pods/ephemeralcontainers implicitly; a
  # ValidatingPolicy must name the subresource, which is how `kubectl debug` adds containers.
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  validations:
    - expression: "!has(object.spec.ephemeralContainers)"
      message: Ephemeral (debug) containers are not permitted.
{{ end }}
