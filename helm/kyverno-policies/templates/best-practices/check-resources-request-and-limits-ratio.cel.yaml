{{- $name := "check-resources-request-and-limits-ratio" }}
{{- if and (hasKey .Values.bestPracticesPolicies.policies $name) (get .Values.bestPracticesPolicies.policies $name).enabled (eq (include "useValidatingPolicy" .) "true") }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ printf "%s%s" .Values.policyNamePrefix $name }}
  labels: {{ include "labels.common" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Enforce Resources as Ratio
    policies.kyverno.io/category: Cost and Resource Optimization
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Resource requests often need to be tailored to the type of workload in the container/Pod.
      With many different types of applications in a cluster, enforcing hard limits on requests
      or limits may not work and a ratio may be better suited instead. This policy checks every
      container in a Pod and ensures that memory limits are no more than 2.5x its requests.
spec:
  validationActions: {{ include "validationActions" (get .Values.bestPracticesPolicies.policies $name).mode | nindent 4 }}
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  validations:
    # A missing memory limit counts as 0 and a missing memory request as 1m, as in the
    # ClusterPolicy. The API server sets requests=limits on Pods that only define limits.
    - expression: >-
        object.spec.containers.all(c,
          !(quantity(c.?resources.?limits.?memory.orValue('0')).asApproximateFloat() /
            quantity(c.?resources.?requests.?memory.orValue('1m')).asApproximateFloat() > 2.5))
      message: Limits may not exceed 2.5x the requests.
{{- end }}
