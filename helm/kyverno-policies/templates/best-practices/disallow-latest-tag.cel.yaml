{{- $name := "disallow-latest-tag" }}
{{- if and (hasKey .Values.bestPracticesPolicies.policies $name) (get .Values.bestPracticesPolicies.policies $name).enabled (eq (include "useValidatingPolicy" .) "true") }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ printf "%s%s" .Values.policyNamePrefix $name }}
  labels: {{ include "labels.common" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Workload Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected errors if the
      image changes. A best practice is to use an immutable tag that maps to
      a specific version of an application Pod. This policy validates that the image
      specifies a tag and that it is not called `latest`.
spec:
  validationActions: {{ include "validationActions" (get .Values.bestPracticesPolicies.policies $name).mode | nindent 4 }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  variables:
    - name: ctnrs
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    # Same semantics as the ClusterPolicy patterns "*:*" and "!*:latest".
    - expression: >-
        variables.ctnrs.all(c, c.image.contains(':'))
      message: "An image tag is required."
    - expression: >-
        variables.ctnrs.all(c, !c.image.endsWith(':latest'))
      message: "Using a mutable image tag e.g. 'latest' is not allowed."
{{- end }}
