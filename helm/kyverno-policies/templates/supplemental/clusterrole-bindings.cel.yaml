{{- /*
A ValidatingPolicy is only ready once Kyverno's reports controller can get, list and watch every
resource it matches. Kyverno's default reports-controller role reads through the "view" ClusterRole,
which excludes RBAC objects, so the binding policies need this read-only grant.
*/ -}}
{{- $p := .Values.supplementalSecurityPolicies.policies -}}
{{- $clusteradmin := and (hasKey $p "restrict-binding-clusteradmin") (get $p "restrict-binding-clusteradmin").enabled -}}
{{- $systemGroups := and (hasKey $p "restrict-binding-system-groups") (get $p "restrict-binding-system-groups").enabled -}}
{{- if and (or $clusteradmin $systemGroups) (eq (include "useValidatingPolicy" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:kyverno-policies:restrict-binding:bindings
  labels:
    {{- include "labels.common" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
{{- end }}
