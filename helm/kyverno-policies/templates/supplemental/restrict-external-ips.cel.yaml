{{- $name := "restrict-external-ips" }}
{{- if and (hasKey .Values.supplementalSecurityPolicies.policies $name) (get .Values.supplementalSecurityPolicies.policies $name).enabled (eq (include "useValidatingPolicy" .) "true") }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ printf "%s%s" .Values.policyNamePrefix $name }}
  labels: {{ include "labels.common" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Restrict External IPs
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Service
    policies.kyverno.io/description: >-
      Service externalIPs can be used for a MITM attack (CVE-2020-8554).
      Restrict externalIPs or limit to a known set of addresses.
      See: https://github.com/kyverno/kyverno/issues/1367. This policy validates
      that the `externalIPs` field is not set on a Service.
spec:
  {{- with (get .Values.supplementalSecurityPolicies.policies $name).failurePolicy }}
  failurePolicy: {{ . }}
  {{- end }}
  validationActions: {{ include "validationActions" (get .Values.supplementalSecurityPolicies.policies $name).mode | nindent 4 }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [services]
  validations:
    - expression: "!has(object.spec.externalIPs)"
      message: "externalIPs are not allowed."
{{- end }}
