{{- $name := "audit-event-on-exec" }}
{{- if and (hasKey .Values.supplementalSecurityPolicies.policies $name) (get .Values.supplementalSecurityPolicies.policies $name).enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ printf "%s%s" .Values.policyNamePrefix $name }}
  labels: {{ include "labels.common" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Audit Event on Pod Exec
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.10.0
    policies.kyverno.io/minversion: 1.10.0
    kyverno.io/kubernetes-version: "1.26"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Kubernetes Events are limited in that the circumstances under which they
      are created cannot be changed. This policy generates a custom Event
      whenever a user execs into a Pod, capturing the requesting user's
      identity and the command that was run. This surfaces exec activity
      through the Events API as an additional signal alongside the API
      server audit log.
spec:
  background: false
  rules:
  - name: generate-event-on-exec
    match:
      any:
      - resources:
          kinds:
          - Pod/exec
    context:
    - name: parentPodUID
      apiCall:
        urlPath: /api/v1/namespaces/{{ `{{` }}request.namespace{{ `}}` }}/pods/{{ `{{` }}request.name{{ `}}` }}
        jmesPath: metadata.uid
    generate:
      apiVersion: v1
      kind: Event
      name: exec.{{ `{{` }} random('[a-z0-9]{6}') {{ `}}` }}
      namespace: "{{ `{{` }}request.namespace{{ `}}` }}"
      synchronize: false
      data:
        firstTimestamp: "{{ `{{` }} time_now_utc() {{ `}}` }}"
        involvedObject:
          apiVersion: v1
          kind: Pod
          name: "{{ `{{` }} request.name {{ `}}` }}"
          namespace: "{{ `{{` }} request.namespace {{ `}}` }}"
          uid: "{{ `{{` }} parentPodUID {{ `}}` }}"
        lastTimestamp: "{{ `{{` }} time_now_utc() {{ `}}` }}"
        message: An exec was performed by {{ `{{` }} request.userInfo | to_string(@) {{ `}}` }} running commands {{ `{{` }} request.object.command {{ `}}` }}
        reason: Exec
        source:
          component: kyverno
        type: Warning
{{- end }}
