kyverno-policies:  # @schema skipProperties: true; additionalProperties: true
  policyType: ClusterPolicy
  podSecurityStandard: restricted
  # includeOtherPolicies:
  #   - require-non-root-groups
  customLabels:
    application.giantswarm.io/team: shield

policyNamePrefix: ""  # Prefix to add to the name of all custom policies. Does not apply to PSS policies. Example: "gs-"

bestPracticesPolicies:
  policies:
    # check-resources-request-and-limits-ratio ensures that the resource limits are no more than 2.5x requests.
    check-resources-request-and-limits-ratio:
      enabled: false
      mode: Audit

    # disallow-latest-tag ensures that the latest tag is not used in container images.
    disallow-latest-tag:
      enabled: true
      mode: Audit

    # prevent-bare-pods ensures that all Pods are created by workload controllers such as Deployments.
    prevent-bare-pods:
      enabled: true
      mode: Audit

    # require-container-requests-limits ensures that all containers have resource requests and limits defined.
    require-container-requests-and-limits:
      enabled: false
      mode: Audit

    # require-emptydir-requests-and-limits ensures that all emptyDir volumes have resource requests and limits defined.
    require-emptydir-requests-and-limits:
      enabled: true
      mode: Audit

    # require-pod-probes ensures that all Pods have liveness, readiness, or startup probes defined.
    require-pod-probes:
      enabled: false
      mode: Audit

supplementalSecurityPolicies:
  policies:
    # audit-event-on-exec generates a Kubernetes Event capturing the requesting user and command whenever someone execs into a Pod. Surfaces exec activity as an additional signal alongside the API server audit log.
    audit-event-on-exec:
      enabled: false

    # add-default-deny-network-policy generates a new NetworkPolicy resource in every newly created Namespace which will deny all traffic.
    add-default-deny-network-policy:
      enabled: false
      # Whether to keep or delete all generated Network Policies when the Kyverno generate policy is deleted.
      deleteNetworkPolicyOnKyvernoPolicyDeletion: false
      # Whether to generate Network Policies in Namespaces that already exist when the Kyverno Policy is deployed.
      generateForExistingNamespaces: false
      networkPolicy:
        policyName: default-deny
        blockIngress: true
        blockEgress: true

    # check-serviceaccount-secrets ensures that ServiceAccounts do not use long-lived tokens.
    check-serviceaccount-secrets:
      enabled: false
      mode: Audit

    # disallow-gitrepo-volume prevents the use of the gitRepo volume type.
    disallow-gitrepo-volume:
      enabled: true
      mode: Audit

    # require-ro-rootfs ensures that container root filesystems are mounted as read-only.
    require-ro-rootfs:
      enabled: false
      mode: Audit

    # restrict-binding-clusteradmin prevents creating bindings to the cluster-admin ClusterRole.
    restrict-binding-clusteradmin:
      enabled: false
      mode: Audit

    # restrict-binding-system-groups prevents creating bindings to system groups including system:anonymous, system:unauthenticated, and system:masters.
    restrict-binding-system-groups:
      enabled: false
      mode: Audit

    # restrict-external-ips prevents the use of Services of type ExternalIP.
    restrict-external-ips:
      enabled: true
      mode: Audit
      # "Ignore" fails open if Kyverno is down. Unset keeps
      # the Kyverno default ("Fail").
      # failurePolicy: Ignore

    # restrict-sa-automount-sa-token ensures that ServiceAccounts do not automatically mount ServiceAccount tokens.
    restrict-sa-automount-sa-token:
      enabled: false
      mode: Audit

# debugAccessPolicies are a set of policies that are used to allow selective usage of ephemeral containers and interactive sessions.
# These policies should be used in combination with RBAC limiting the users who are permitted to use `kubectl exec` and `kubectl debug`.
# This feature should NOT be considered a replacement for RBAC.
# See the README for more information.
debugAccessPolicies:

  # allowedDebugContainerImages is a list of image patterns allowed in debug containers.
  # Supports glob wildcards: '*' matches any sequence of characters.
  # Examples: "busybox:*" (any busybox tag), "registry.io/tools/*:v1.*" (any v1.x image).
  allowedDebugContainerImages: &allowedDebugContainerImages []

  # authorizedDebugTargets defines which namespaces or deployments can be debugged using this mechanism.
  # Empty values will "fail closed" and match no targets.
  authorizedDebugTargets:
  - namespaces: []
    allDeployments: false
    deployments: []
    allowedDebugContainerImages: *allowedDebugContainerImages

  policies:
    # disallow-ephemeral-containers blocks the use of ephemeral containers.
    disallow-ephemeral-containers:
      enabled: false
      mode: Audit

    # disallow-unapproved-debug-access blocks the use of debug access to unauthorized deployments.
    # This policy is a ValidatingPolicy (policies.kyverno.io/v1) using CEL expressions.
    # Mode mapping: "Audit" -> Audit, "Enforce" -> Deny (ValidatingPolicy terminology).
    disallow-unapproved-debug-access:
      enabled: false
      mode: Audit

    # block-expired-exceptions prevents deploying PolicyExceptions with expired timestamps.
    # This policy MUST be co-enabled with purge-expired-exceptions (Helm will fail otherwise).
    block-expired-exceptions:
      enabled: false
      mode: Audit

    # purge-expired-exceptions removes expired temporary PolicyExceptions.
    # This policy MUST be co-enabled with block-expired-exceptions (Helm will fail otherwise).
    purge-expired-exceptions:
      enabled: false
      mode: Audit
      cleanupSchedule: "*/27 * * * *"  # Every 27 minutes
      targetAnnotation: "policy.giantswarm.io/exception-expires-at"

# imageVerification renders one ImageValidatingPolicy (policies.kyverno.io/v1) per enabled
# verifier, named "<policyNamePrefix>verify-image-signatures-<name>". Each policy checks that
# the images of matching Pods carry a valid cosign signature from the configured attestors.
#
# Both blocks below use the same verifier shape:
#   name                  ^[a-z0-9-]+$, unique across both blocks, becomes the policy name suffix.
#   enabled               render the policy (default true).
#   mode                  Audit | Enforce; Enforce renders validationActions [Deny] (default Audit).
#   admission             evaluate in the admission webhook; forced true when mode is Enforce (default false).
#   backgroundScan        evaluate existing Pods on the reports controller's schedule (default true).
#   failurePolicy         Ignore | Fail; only matters when admission is on (default Ignore).
#   mutateDigest          replace tags with the verified digest at admission (default false).
#   verifyDigest          require images to be referenced by digest (default false).
#   images                globs matched against the image reference as written in the Pod spec; at least one.
#                         Only '*' (any sequence) is supported as a wildcard; entries may contain only
#                         letters, digits and . _ / : @ - *.
#   excludeImages         globs removed from the match, same syntax as images (default []).
#   minVerifiedAttestors  how many attestors must verify; 1 = any of them (default 1).
#   attestors             at least one. Each has a name (^[a-z0-9]+$, it becomes a CEL identifier) and
#                         exactly one of:
#                           keyless: {issuer, subject | subjectRegExp}   Fulcio-issued certificate identity
#                           key: {publicKey}                             PEM public key
#                         plus optional rekorUrl and ignoreTlog (true for key-based signatures made
#                         without a transparency log).
#   credentials           for private registries: providers is a subset of
#                         [default, azure, google, amazon, github]; secrets live in the Kyverno namespace.
imageVerification:
  # Verifiers shipped by Giant Swarm. Fixed keys; each value has the item shape
  # of `customer`, and the key must equal its `name`. Tune a field by deep
  # merge, e.g. giantswarm.gsoci-circleci-keyless.mode or giantswarm.gsoci-circleci-keyless.enabled.
  giantswarm:
    gsoci-circleci-keyless:
      name: gsoci-circleci-keyless  # @schema required: true; pattern: ^[a-z0-9-]+$
      enabled: true
      mode: Audit  # @schema enum: [Audit, Enforce]
      admission: false
      backgroundScan: true
      failurePolicy: Ignore  # @schema enum: [Ignore, Fail]
      mutateDigest: false
      verifyDigest: false
      images:  # @schema required: true; minItems: 1; item: string; itemPattern: ^[A-Za-z0-9._/:@*-]+$
        - "gsoci.azurecr.io/giantswarm/*"
      excludeImages: []  # @schema item: string; itemPattern: ^[A-Za-z0-9._/:@*-]+$
      minVerifiedAttestors: 1  # @schema minimum: 1
      # @schema required: true; minItems: 1; itemRequired: [name]
      # @schema itemProperties: {name: {type: string, pattern: "^[a-z0-9]+$"}, keyless: {type: object, required: [issuer], properties: {issuer: {type: string}, subject: {type: string}, subjectRegExp: {type: string}}}, key: {type: object, required: [publicKey], properties: {publicKey: {type: string}}}, rekorUrl: {type: string}, ignoreTlog: {type: boolean}}
      # @schema allOf: [{type: array, items: {oneOf: [{required: [keyless]}, {required: [key]}]}}]
      attestors:
        # Images mirrored by retagger are signed with a `nil` pipeline-definition
        # segment, so the subjectRegExp accepts both a UUID and `nil` there.
        - name: circleci
          keyless:
            issuer: https://oidc.circleci.com
            subjectRegExp: ^https://circleci\.com/api/v2/projects/[a-f0-9-]+/pipeline-definitions/([a-f0-9-]+|nil)$
          rekorUrl: https://rekor.sigstore.dev
          ignoreTlog: false
        # - name: kms             # a future key-based co-signature that is an *alternative* goes here;
        #   key:                  # a verifier for a different image set goes under a new giantswarm key
        #     publicKey: |        # PEM
        #   ignoreTlog: true
      credentials:
        providers: []  # @schema item: string; itemEnum: [default, azure, google, amazon, github]
        secrets: []  # @schema item: string

  # Verifiers owned by the customer. Same shape as the giantswarm values.
  # Replaced wholesale on merge. Generated policies exclude the images of
  # every enabled `giantswarm.*` entry, using that entry's `images` globs as
  # they are. A giantswarm entry's own `excludeImages` is not subtracted from
  # that exclusion, so images it leaves out are verified by no generated policy,
  # and listing them in a customer entry's `images` does not change that. To
  # verify them, disable the giantswarm entry (its whole image set then falls to
  # the customer policies) and add a customer entry for it.
  # @schema itemRef: #/properties/imageVerification/properties/giantswarm/properties/gsoci-circleci-keyless
  customer: []
  # - name: acme-prod
  #   mode: Audit
  #   images: ["registry.acme.example/prod/*"]
  #   attestors:
  #     - name: ci
  #       keyless: { issuer: ..., subjectRegExp: ... }
  #   credentials:
  #     secrets: [acme-registry-pull]
