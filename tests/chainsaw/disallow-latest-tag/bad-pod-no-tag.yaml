apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-tag
spec:
  containers:
  - name: container01
    image: busybox
    args:
    - sleep
    - 1d
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
