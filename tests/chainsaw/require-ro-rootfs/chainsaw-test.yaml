# Runs in Audit: in Enforce the policy would deny the Pods of every other test, so it asserts the
# PolicyReport results instead of a denial. It uses Deployments with no replicas, which also covers
# the rules autogenerated for Pod controllers, and keeps prevent-bare-pods out of the way.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-ro-rootfs
spec:
  steps:
  - name: create a bad deployment with a writable root filesystem and wait for its failing report
    try:
    - create:
        expect:
        - check:
            ($error != null): false
        file: bad-deployment.yaml
    - assert:
        # The harness runs the reports controller with --backgroundScanInterval=1m.
        timeout: 3m
        resource:
          apiVersion: wgpolicyk8s.io/v1alpha2
          kind: PolicyReport
          scope:
            apiVersion: apps/v1
            kind: Deployment
            name: bad-deployment-rw-rootfs
          (results[?policy=='require-ro-rootfs']):
          - result: fail
  - name: create a good deployment with a read-only root filesystem and wait for its passing report
    try:
    - create:
        expect:
        - check:
            ($error != null): false
        file: good-deployment.yaml
    - assert:
        timeout: 3m
        resource:
          apiVersion: wgpolicyk8s.io/v1alpha2
          kind: PolicyReport
          scope:
            apiVersion: apps/v1
            kind: Deployment
            name: good-deployment-ro-rootfs
          (results[?policy=='require-ro-rootfs']):
          - result: pass
