# Values for testing Kyverno policies with Chainsaw
# Set all policies to Enforce mode so tests can verify blocking behavior

kyverno-policies:
  validationFailureAction: Enforce

# Best practices policies
bestPracticesPolicies:
  policies:
    check-resources-request-and-limits-ratio:
      enabled: true
      mode: Enforce
    disallow-latest-tag:
      enabled: true
      mode: Enforce
    # Audit: in Enforce these would deny nearly every other test's Pods; their tests assert the PolicyReport.
    prevent-bare-pods:
      enabled: true
      mode: Audit
    require-container-requests-and-limits:
      enabled: true
      mode: Audit
    require-pod-probes:
      enabled: true
      mode: Audit
    require-emptydir-requests-and-limits:
      enabled: true
      mode: Enforce

# Supplemental security policies
supplementalSecurityPolicies:
  policies:
    audit-event-on-exec:
      enabled: true
    add-default-deny-network-policy:
      enabled: true
    disallow-gitrepo-volume:
      enabled: true
      mode: Enforce
    restrict-external-ips:
      enabled: true
      mode: Enforce
    check-serviceaccount-secrets:
      enabled: true
      mode: Enforce
    restrict-binding-clusteradmin:
      enabled: true
      mode: Enforce
    restrict-binding-system-groups:
      enabled: true
      mode: Enforce
    # Audit: in Enforce it would deny other tests' Pods; its test asserts the PolicyReport.
    require-ro-rootfs:
      enabled: true
      mode: Audit
    # Audit: in Enforce it would deny every namespace's default ServiceAccount.
    restrict-sa-automount-sa-token:
      enabled: true
      mode: Audit

# Debug access policies
debugAccessPolicies:
  authorizedDebugTargets:
  - namespaces: ["debug-access-test"]
    allDeployments: true
    allowedDebugContainerImages: ["busybox:*"]
  - namespaces: ["disallow-ephemeral-containers-test"]
    allDeployments: true
    allowedDebugContainerImages: ["busybox:*"]
  policies:
    block-expired-exceptions:
      enabled: true
      mode: Enforce
    disallow-ephemeral-containers:
      enabled: true
      mode: Enforce
    disallow-unapproved-debug-access:
      enabled: true
      mode: Enforce
    purge-expired-exceptions:
      enabled: true
      mode: Enforce
      cleanupSchedule: "* * * * *"
      targetAnnotation: "policy.giantswarm.io/exception-expires-at"

# One image verifier per chainsaw scenario, each matching its own images. Only one verifier may run in
# admission (Enforce): Kyverno 1.18 deadlocks when two ImageValidatingPolicies evaluate one request
# (kyverno/sdk#143, fixed in Kyverno 1.19.2).
imageVerification:
  giantswarm:
    gsoci-circleci-keyless:
      mode: Enforce
  customer:
  - name: test-audit
    mode: Audit
    backgroundScan: true
    images: ["mirror.gcr.io/library/busybox*"]
    attestors:
    - name: circleci
      keyless:
        issuer: https://oidc.circleci.com
        subjectRegExp: ^https://circleci\.com/api/v2/projects/[a-f0-9-]+/pipeline-definitions/([a-f0-9-]+|nil)$
      rekorUrl: https://rekor.sigstore.dev
