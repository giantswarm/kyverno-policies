# Sets capabilities but no drop list. Passes every other restricted policy.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-add-without-drop
spec:
  containers:
  - name: container01
    image: busybox:1.35
    args:
    - sleep
    - 1d
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        add:
        - NET_BIND_SERVICE
