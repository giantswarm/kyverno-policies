apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-gitrepo
spec:
  containers:
  - name: container01
    image: busybox:1.35
    args:
    - sleep
    - 1d
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: git
      mountPath: /git
  volumes:
  - name: git
    gitRepo:
      repository: "https://github.com/example/repo"
