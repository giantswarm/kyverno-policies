apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: good-polex-no-annotation
spec:
  exceptions:
  - policyName: disallow-ephemeral-containers
    ruleNames:
    - disallow-ephemeral-containers
  match:
    any:
    - resources:
        kinds:
        - Pod
        # Matches nothing: the exception must not exempt Pods in other tests while it exists.
        namespaces:
        - block-expired-exceptions-no-match
