# Waits until an ImageValidatingPolicy reports ready. Hand-written, unlike cluster-policy-ready.yaml.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: image-validating-policy-ready
spec:
  try:
  - assert:
      template: true
      resource:
        apiVersion: policies.kyverno.io/v1
        kind: ImageValidatingPolicy
        metadata:
          name: ($name)
        status:
          conditionStatus:
            ready: true
            (conditions[?type == 'RBACPermissionsGranted']):
            - reason: Succeeded
              status: "True"
