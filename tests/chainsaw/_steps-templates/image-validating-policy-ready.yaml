# Reusable step: wait until an ImageValidatingPolicy (policies.kyverno.io/v1)
# reports ready. Kyverno 1.18 sets status.conditionStatus.ready once the policy
# is ready for reporting (RBACPermissionsGranted) and, when admission is
# enabled, its webhook is configured (WebhookConfigured).
# Not generated by devctl, unlike cluster-policy-ready.yaml.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: image-validating-policy-ready
spec:
  try:
  - assert:
      template: true
      resource:
        apiVersion: policies.kyverno.io/v1
        kind: ImageValidatingPolicy
        metadata:
          name: ($name)
        status:
          conditionStatus:
            ready: true
            (conditions[?type == 'RBACPermissionsGranted']):
            - reason: Succeeded
              status: "True"
