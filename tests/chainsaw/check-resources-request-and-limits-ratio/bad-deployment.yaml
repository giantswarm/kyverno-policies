apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment-ratio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-deployment-ratio
  template:
    metadata:
      labels:
        app: bad-deployment-ratio
    spec:
      containers:
      - name: container01
        image: busybox:1.35
        args:
        - sleep
        - 1d
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 64Mi
