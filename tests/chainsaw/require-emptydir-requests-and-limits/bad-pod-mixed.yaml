apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-emptydir-mixed
spec:
  containers:
  - name: container01
    image: busybox:1.35
    args:
    - sleep
    - 1d
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        ephemeral-storage: 200Mi
    volumeMounts:
    - name: sized
      mountPath: /sized
    - name: data
      mountPath: /data
  volumes:
  - name: sized
    emptyDir:
      sizeLimit: 100Mi
  - name: data
    emptyDir: {}
