apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: audit-event-on-exec
spec:
  steps:
  - name: create test pod
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: audit-exec-test
          spec:
            terminationGracePeriodSeconds: 0
            containers:
            - name: app
              image: busybox:1.36
              command: ["sleep", "3600"]
            restartPolicy: Never
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: audit-exec-test
          status:
            phase: Running

  - name: exec into pod
    try:
    - script:
        env:
        - name: NAMESPACE
          value: ($namespace)
        content: |
          kubectl exec -n "$NAMESPACE" audit-exec-test -- echo chainsaw-exec-marker

  - name: assert exec event was generated
    try:
    - script:
        timeout: 30s
        env:
        - name: NAMESPACE
          value: ($namespace)
        content: |
          for i in $(seq 1 15); do
            if kubectl get events -n "$NAMESPACE" --field-selector reason=Exec -o jsonpath='{.items[*].message}' | grep -q "chainsaw-exec-marker"; then
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: expected an Exec event referencing chainsaw-exec-marker but found none"
          kubectl get events -n "$NAMESPACE"
          exit 1
