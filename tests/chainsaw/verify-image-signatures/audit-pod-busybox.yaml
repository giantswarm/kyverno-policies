# Unsigned image matched by the test-audit verifier: admitted, then reported as a failure.
apiVersion: v1
kind: Pod
metadata:
  name: audit-pod-busybox
spec:
  containers:
  - name: busybox
    image: mirror.gcr.io/library/busybox:1.36
    args:
    - sleep
    - 1d
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
