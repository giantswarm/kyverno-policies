# A Pod running a Giant Swarm image from gsoci.azurecr.io whose cosign
# signature carries the CircleCI identity the default verifier expects
# (verified with the Kyverno CLI 1.18.2 on 2026-10-29).
apiVersion: v1
kind: Pod
metadata:
  name: gs-signed
  namespace: default
spec:
  containers:
    - name: chart-operator
      image: gsoci.azurecr.io/giantswarm/chart-operator:4.2.2
      command: ["sleep", "3600"]
