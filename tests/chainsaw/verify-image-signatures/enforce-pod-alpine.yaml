# Unsigned image matched by the test-enforce verifier: denied.
apiVersion: v1
kind: Pod
metadata:
  name: enforce-pod-alpine
spec:
  containers:
  - name: alpine
    image: mirror.gcr.io/library/alpine:3.20
    args:
    - sleep
    - 1d
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
