# Signed Giant Swarm image referenced by tag.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-signed
spec:
  containers:
  - name: chart-operator
    image: gsoci.azurecr.io/giantswarm/chart-operator:4.2.2
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
