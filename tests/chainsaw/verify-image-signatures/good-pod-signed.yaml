# A Giant Swarm image referenced by tag whose cosign signature carries the
# CircleCI identity the gsoci-circleci-keyless verifier expects (verified with
# the Kyverno CLI 1.18.2 on 2026-10-29).
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-signed
spec:
  containers:
  - name: chart-operator
    image: gsoci.azurecr.io/giantswarm/chart-operator:4.2.2
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
