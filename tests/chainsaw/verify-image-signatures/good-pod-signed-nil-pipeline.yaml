# Retagger-mirrored image, signed with a pipeline-definitions/nil subject.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-signed-nil-pipeline
spec:
  containers:
  - name: kubectl
    image: gsoci.azurecr.io/giantswarm/kubectl:v1.37.2
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
