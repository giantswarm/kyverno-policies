name: "Test Kyverno Policies with Chainsaw"
on:
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
env:
  KYVERNO_POLICIES_APP_NAME: kyverno-policies
  KIND_CLUSTER_NAME: chainsaw-kyverno-cluster
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: v0.25.0
  # renovate: datasource=docker depName=kindest/node
  KUBERNETES_VERSION: v1.33.7
  # renovate: datasource=github-releases depName=giantswarm/kyverno-crds
  KYVERNO_VERSION: v1.18.0
  HELM_VERSION: 4

permissions: {}

jobs:
  test-policies:
    name: "Test Kyverno Policies"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@1223ef75bedeb59c4e7b5455463d4316e76dff01 # v0.2.15
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          node_image: kindest/node:${{ env.KUBERNETES_VERSION }}
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Install Make
        run: |
          sudo apt-get update && sudo apt-get install make
      - name: Create kind cluster and install kyverno
        run: |
          make kind-get-kubeconfig install-kyverno
      - name: Install extra resources
        run: |
          make install-extras
      - name: Install Kyverno Policies
        run: |
          make install-policies
      - name: Run Chainsaw tests
        run: |
          chainsaw test ./tests/chainsaw
